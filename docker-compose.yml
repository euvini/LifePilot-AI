services:
  postgres:
    image: postgres:16-alpine
    container_name: lifepilot-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL already on 5432.
      - '5433:5432'
    environment:
      POSTGRES_USER: lifepilot
      POSTGRES_PASSWORD: lifepilot
      POSTGRES_DB: lifepilot
    volumes:
      - lifepilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifepilot -d lifepilot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifepilot_pg_data:
